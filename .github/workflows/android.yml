name: Build JpMC Synapse Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Restore Android release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jpmc-synapse-release.jks"

      - name: Grant Gradle permission
        working-directory: android
        run: chmod +x gradlew

      - name: Build Signed Release APK and AAB
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/jpmc-synapse-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Prepare release files
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk JpMC-Synapse-Release.apk
          cp android/app/build/outputs/bundle/release/app-release.aab JpMC-Synapse-Release.aab

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: JpMC-Synapse-Release-APK
          path: JpMC-Synapse-Release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: JpMC-Synapse-Release-AAB
          path: JpMC-Synapse-Release.aab
          if-no-files-found: error
          retention-days: 30
