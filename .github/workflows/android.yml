name: Build JpMC Synapse Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --------------------------------------------------
      # 3. Install npm dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # --------------------------------------------------
      # 4. Build web application
      # --------------------------------------------------
      - name: Build web application
        run: npm run build

      # --------------------------------------------------
      # 5. Sync Capacitor Android project
      # --------------------------------------------------
      - name: Sync Capacitor Android
        run: npx cap sync android

      # --------------------------------------------------
      # 6. Setup Java
      # --------------------------------------------------
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # --------------------------------------------------
      # 7. Restore permanent release keystore
      # --------------------------------------------------
      - name: Restore Android release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "Checking GitHub signing secrets..."

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is EMPTY or unavailable."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD secret is EMPTY or unavailable."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS secret is EMPTY or unavailable."
            exit 1
          fi

          echo "KEYSTORE_BASE64 is available."
          echo "Base64 character count: ${#KEYSTORE_BASE64}"

          printf '%s' "$KEYSTORE_BASE64" \
            | tr -d '\r\n ' \
            | base64 --decode \
            > "$RUNNER_TEMP/jpmc-synapse-release.jks"

          echo "Restored keystore size:"
          stat -c%s "$RUNNER_TEMP/jpmc-synapse-release.jks"

          if [ ! -s "$RUNNER_TEMP/jpmc-synapse-release.jks" ]; then
            echo "ERROR: Restored keystore is empty."
            exit 1
          fi

          echo "Verifying restored keystore..."

          keytool -list \
            -keystore "$RUNNER_TEMP/jpmc-synapse-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

          echo "Keystore verification successful."

      # --------------------------------------------------
      # 8. Grant Gradle execution permission
      # --------------------------------------------------
      - name: Grant Gradle permission
        working-directory: android
        run: chmod +x gradlew

      # --------------------------------------------------
      # 9. Build signed Release APK + AAB
      # --------------------------------------------------
      - name: Build Signed Release APK and AAB
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/jpmc-synapse-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD secret is EMPTY or unavailable."
            exit 1
          fi

          echo "Building signed release..."

          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      # --------------------------------------------------
      # 10. Verify APK exists
      # --------------------------------------------------
      - name: Verify build outputs
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          if [ ! -f "$AAB" ]; then
            echo "ERROR: Release AAB was not generated."
            exit 1
          fi

          echo "Release APK and AAB generated successfully."

          ls -lh "$APK"
          ls -lh "$AAB"

      # --------------------------------------------------
      # 11. Verify APK signing certificate
      # --------------------------------------------------
      - name: Verify APK signature
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name apksigner \
            | sort -V \
            | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found."
            exit 1
          fi

          echo "Using:"
          echo "$APKSIGNER"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"

      # --------------------------------------------------
      # 12. Prepare friendly filenames
      # --------------------------------------------------
      - name: Prepare release files
        shell: bash
        run: |
          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            JpMC-Synapse-Release.apk

          cp \
            android/app/build/outputs/bundle/release/app-release.aab \
            JpMC-Synapse-Release.aab

      # --------------------------------------------------
      # 13. Upload signed APK
      # --------------------------------------------------
      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: JpMC-Synapse-Release-APK
          path: JpMC-Synapse-Release.apk
          if-no-files-found: error
          retention-days: 30

      # --------------------------------------------------
      # 14. Upload AAB
      # --------------------------------------------------
      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: JpMC-Synapse-Release-AAB
          path: JpMC-Synapse-Release.aab
          if-no-files-found: error
          retention-days: 30
